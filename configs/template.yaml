# ============================================================
# 爬虫配置模板
# 用法: uv run python -m crawler.cli configs/template.yaml
# 本文件展示所有支持的配置项, 作为语法参考
# ============================================================

name: template

# ── qBittorrent 连接 ─────────────────────────────────────────
qb:
  url: "http://localhost:8080"
  user: "user"
  password: "password"
  category: "" # 默认分类; 可在 stage 中覆盖
  timeout: 30 # 请求超时秒数
  sequential_download: true
  first_last_piece_prio: true
  add_to_top_of_queue: true

# ── Playwright 浏览器 ────────────────────────────────────────
browser:
  headless: false # 生产环境建议 true
  args: ["--blink-settings=imagesEnabled=false"]

# ── HTML 响应缓存 ───────────────────────────────────────────
# 按 URL 缓存抓到的 HTML, 重跑时命中缓存直接跳过 fetch
# 缓存命中后 extract / filter / qb_send 照常执行
# (qb 重复磁力由 qBittorrent 按 hash 自动忽略)
cache:
  enabled: false # 全局默认关闭, 置 true 开启
  dir: "cache" # 缓存目录 (Docker 下落在挂载的 ./work/cache)
  ttl: 0 # 过期秒数, 0 = 永不过期; 站点结构变化时删掉缓存目录即可

# ══════════════════════════════════════════════════════════════
# stages: 爬取步骤列表
#
# 核心概念:
#   1. 每步从 input 获取上游资源列表
#   2. 对每个资源, 根据 url_pattern 或 字段 构建 URL
#   3. 用 fetcher 抓取 (playwright / httpx)
#   4. 用 extract 从 HTML 中提取新资源
#   5. 用 filter 过滤结果
#   6. 可选 compare: 过滤后结果 >1 时比较去重 / 选优
#   7. 结果存入 output_store[stage.id]
#   8. 下一步通过 input 引用, 循环往复
#
# 第一步无 input, 用 urls / url_pattern+url_range 生成种子 URL
# ══════════════════════════════════════════════════════════════
stages:
  # ────────── 第 1 步: 种子 URL + 正则提取 ─────────────────
  # 无 input → 用 url_pattern + url_range 自动生成 URL 列表
  # 或者直接用 urls 静态列举:
  #   urls: ["https://example.com/list?page=1", ".../page=2"]
  # ──────────────────────────────────────────────────────────
  - id: ids
    fetcher: playwright # 使用 Playwright (可渲染 JS)
    concurrency: 3 # 并发上限
    delay: 1.0 # 每次抓取后延时
    # retry: playwright/httpx 均支持 (默认 1 次不重试)
    retry:
      max_retries: 3
      retryable_codes: [429, 502, 503, 504]
    debug_save: true # 覆盖全局 --debug-save: 本 stage 强制保存 HTML
    cache: true # 覆盖全局 cache.enabled: 本 stage 单独开启缓存
    url_pattern: "https://example.com/list?page={page}"
    url_range:
      name: page
      start: 1
      end: 3 # 生成 page=1,2 (end 不包含)
      step: 1
    # 多范围写法: 每个 url_range 对应 url_pattern 中的一个 {field}
    # 多个范围会按笛卡尔积生成 URL:
    # url_pattern: "https://example.com/list?page={page}&category={category}"
    # url_range:
    #   - name: page
    #     start: 1
    #     end: 3
    #     step: 1
    #   - name: category
    #     start: 1
    #     end: 3
    #     step: 1
    security: false # 是否自动点击安全验证按钮
    security_selector: ".enter-btn"
    extract:
      type: regex
      pattern: '<a href="/detail/(\d+)">(.*?)</a>'
      flags: [I, S] # 忽略大小写 + . 匹配换行
      multiple: true # 返回所有匹配 (默认 true)
    # regex 匹配组自动命名为 group_0, group_1, ...
    resources: ["group_0", "group_1"]

  # ────────── 第 1b 步: 第二个种子源 (演示多 input) ──────
  # 与 ids 相同, 但抓取不同的页, 作为 posts 的第二个上游
  # ──────────────────────────────────────────────────────────
  - id: ids2
    fetcher: playwright
    concurrency: 3
    delay: 1.0
    url_pattern: "https://example.com/list?page={page}"
    url_range:
      name: page
      start: 3
      end: 5 # 生成 page=3,4
      step: 1
    extract:
      type: regex
      pattern: '<a href="/detail/(\d+)">(.*?)</a>'
      flags: [I, S]
      multiple: true
    resources: ["group_0", "group_1"]

  # ────────── 第 2 步: 多提取规则 + 过滤 ──────────────────
  # input 可以是单个 stage id, 也可以是列表:
  #   input: [ids, ids2] → 拼接多个上游, 按目标 URL 去重后抓取
  #   目标 URL 优先取 _url, 否则用本 stage 的 url_pattern (或 url 字段) 计算
  #   没有目标 URL 时用 dedup_by 指定去重字段; _source_url 不作为去重键
  # dedup_by: 在抓取前按字段去重输入 (如 group_0), 避免重复请求
  # ──────────────────────────────────────────────────────────
  - id: posts
    input: [ids, ids2]
    dedup_by: group_0 # 两个源可能抓到相同 id, 先去重再抓详情页
    fetcher: playwright
    concurrency: 3
    delay: 1.0
    url_pattern: "https://example.com/detail/{group_0}"
    security: true
    security_selector: ".enter-btn"
    extract:
      # 规则 1: CSS 多字段 — 提取帖子元信息
      - type: css
        selector: "div.post-item"
        fields:
          post_url:
            selector: "a.post-link"
            attribute: href # 取 href 属性; 空/"text" 取文本
          id:
            selector: "a.post-link"
            attribute: href
            pattern: "post-(\\d+)" # 对 href 做正则提取 (有组取组1), 可再配 type: int
            flags: [I]
            type: int
          title:
            selector: "h2.post-title"
          tags:
            selector: "span.tag"
            attribute: title
            multiple: true # 返回列表 (多值时逐个应用 pattern)
          score:
            selector: ".score span"
            replace: {",": ""} # re.sub 去掉千分位, 再转 int
            type: int # 转为整数 (pattern/replace 之后执行)
          author:
            selector: ".author-name"
      # 规则 2: 正则 — 从同页面提取隐藏数据
      # 顶层 multiple: false 表示只保留第一个匹配 (css/xpath/regex 均生效)
      - type: regex
        pattern: 'data-id="(\d+)" data-type="(\w+)"'
        flags: [I]
        multiple: true
    resources:
      ["post_url", "id", "title", "tags", "score", "author", "group_0", "group_1"]
    filter:
      - field: title
        not_contains: "广告"
      - field: tags
        not_in: ["低质量", "垃圾"] # 字段值不在列表中
      - field: title
        eq: "今日推荐" # 字段值完全等于
      - any_of:
          - field: tags
            contains: "精华"
          - all_of:
              - field: score
                gte: 100
              - field: tags
                contains: "推荐"
    # compare: 过滤后的结果比较 (可选, 默认关闭)
    # 仅当过滤后结果 > 1 条时执行; 按 by 字段分组, 每组只保留一条
    # compare:
    #   by: [title]       # 必填; 单个字段名或字段列表
    #                     # 可用: 本 stage 提取字段 / 上游非 _ 字段 / 内部 _source_url, _source
    #                     # 不支持 a.b 嵌套、tags[0] 下标、{field} 模板; 字段缺失的条目不参与比较
    #   keep: max         # first(默认) / last / max / min
    #   metric: [score]   # keep=max/min 时必填; 单字段或字段列表 (依次比较)
    # 简写: compare: group_0  或  compare: [title, season]
    # 缺少 by 字段的条目不参与比较, 会原样保留

  # ────────── 第 3 步: httpx + xpath ──────────────────────
  # 使用上一步的 post_url 字段作为 URL:
  # url_pattern 里的 {post_url} 会被替换成每条的 post_url 值
  # (若 post_url 是相对路径, 会自动基于来源 URL 转成绝对地址)
  # ──────────────────────────────────────────────────────────
  - id: details
    input: posts
    fetcher: httpx
    url_pattern: "{post_url}" # 用 post_url 字段构建待抓取 URL
    concurrency: 10 # httpx 默认并发 10
    delay: 2.0
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
      Accept: "text/html,application/xhtml+xml"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
    retry:
      max_retries: 10
      retryable_codes: [429, 502, 503, 504] # 遇到这些状态码自动重试
    # debug_save: false # 覆盖全局: 本 stage 即使加了 --debug-save 也不保存
    extract:
      type: xpath
      selector: '//div[@class="content"]//a[contains(@href, "magnet")]'
      attribute: href
    resources: ["text"]

  # ────────── 第 4 步: 最终磁力 + qBittorrent ────────────
  # qb_send: true → 发送到 qBittorrent
  # ──────────────────────────────────────────────────────────
  - id: magnets
    input: details
    fetcher: httpx
    url_pattern: "https://example.com/links/{text}"
    extract:
      type: regex
      pattern: "(magnet:\\?xt=urn:btih:[a-fA-F0-9]{32})"
      flags: [I]
      multiple: true
    resources: ["group_0"]
    # filter 在 qb_send 之前执行: 只有通过 filter 的结果才会发送到 qBittorrent
    filter:
      - field: group_0
        contains: "magnet:"
    # category 支持 {字段} 模板, 字段可来自本步 resources, 也可来自上一步 input 合并下来的字段
    # 例如: category: "movie/{id}"       (上一步字段)
    #       category: "movie/{group_0}"  (本步资源)
    # 留空则使用全局 qb.category; 字段缺失/为空时回退全局 qb.category
    category: "movie/{id}"
    qb_send: true # 发送到 qBittorrent


# ══════════════════════════════════════════════════════════════
# 数据流:
#   [种子 URL] ──▶ ids ─┐
#                       ├──▶ posts ──▶ details ──▶ magnets ──▶ qB
#   [种子 URL] ──▶ ids2 ┘   (input 列表)      │            │
#                                   post_url     text       group_0
#                                   title       (magnet)    (magnet)
#                                   tags
#                                   score
#                                   author
#                                   data-id
#                                   data-type
#
# extract 支持单条或列表:
#   extract: {type: regex, ...}         ← 单条 (简写)
#   extract:                            ← 多条
#     - {type: css, ...}
#     - {type: regex, ...}
#
# 多字段 extract 的字段级配置 (css / xpath):
#   selector: 子元素定位 (缺省取当前元素)
#   attribute: 取值来源 — 空/"text" 取文本, 否则取属性值 (如 href)
#   pattern:   对原始值做正则提取, 有捕获组时取组1; 无匹配则该字段缺失
#   replace:   {正则: 替换文本} 对 pattern 后的值逐项 re.sub (按配置顺序, flags 同样生效)
#   flags:     [I, S, M] 正则标志 (同时用于 pattern 和 replace)
#   type:      "int" 转换 (在 pattern/replace 之后执行)
#   multiple:  true 时返回列表, 并对每个子元素逐个应用上述管线
#
# 顶层 multiple: 默认 true 返回全部匹配; 设为 false 仅保留第一个匹配
#
# input 支持单条或列表:
#   input: posts                       ← 单个上游
#   input: [ids, ids2]                 ← 多个上游拼接, 按目标 URL 去重
#   dedup_by: group_0                  ← 按字段去重 (可选; 没有目标 URL 时用它)
# 目标 URL = _url, 或本 stage 的 url_pattern/url 字段计算出的 URL;
# _source_url 是所有同页条目共享的页面地址, 不作为去重键
#
# compare: 过滤后比较提取结果 (默认关闭):
#   仅当过滤后结果 > 1 条时执行; 按 by 字段分组, 每组保留一条
#   compare: group_0                  ← 简写: 单字段去重, 保留第一条
#   compare: [title, season]          ← 简写: 多字段比较
#   compare:
#     by: [title]                     ← 必填; 本 stage 字段 / 上游非 _ 字段 / _source_url
#     keep: max                       ← first(默认) / last / max / min
#     metric: [seeders, leechers]     ← keep=max/min 时必填; 依次比较, 前面的字段优先
#   by 支持单个字段名或字段列表; 不支持 a.b 嵌套、tags[0] 下标、{field} 模板
#   缺少 by 字段的条目不参与比较, 原样保留; 比较结果进入下游与 qBittorrent
#
# debug_save: 每 stage 可覆盖 CLI 全局 --debug-save:
#   未设置      → 跟随 --debug-save
#   debug_save: true   → 即使不加 --debug-save 也保存 (保存到 debug_{stage.id}_*.html)
#   debug_save: false  → 即使加了 --debug-save 也不保存
#
# retry: playwright 与 httpx 均支持 (默认不重试):
#   retry:
#     max_retries: 3
#     retryable_codes: [429, 502, 503, 504]   # 命中状态码或加载异常时退避重试
#
# cache: 每 stage 可覆盖全局 cache.enabled (缺省跟随全局):
#   cache: true  → 本 stage 开启 HTML 缓存
#   cache: false → 本 stage 禁用缓存, 每次都抓取
# ══════════════════════════════════════════════════════════════
